name: zazu_driver
version: 2.2.5+36
publish_to: none
description: ZAZU Driver para Android e iOS conectado a Laravel 12.

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.14.2
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.11
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/zazu_logo.png
    - assets/images/motorizado.png
    - assets/cobertura/cobertura_zazu.kmz
