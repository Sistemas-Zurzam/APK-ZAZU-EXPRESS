plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.zazu.driver"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }
    defaultConfig {
        applicationId "com.zazu.driver"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    buildTypes {
        release {
            // Sin esto, el APK release queda sin firmar y Android rechaza
            // la instalación ("App no instalada"). Firmar con la clave de
            // depuración permite instalar en cualquier celular para
            // pruebas; para publicar en Play Store hace falta un keystore
            // de release propio.
            signingConfig signingConfigs.debug
        }
    }
}
flutter { source '../..' }
