name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El release se firma con la clave de depuración (ver android/app/build.gradle).
      # Si existe el secreto DEBUG_KEYSTORE_BASE64, se usa ese keystore para que
      # el APK quede firmado siempre con la misma clave y se pueda actualizar
      # sobre la versión instalada sin desinstalar.
      - name: Restaurar keystore compartido
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x android/gradlew
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Nombre del APK
        id: name
        run: echo "file=zazu-express-$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-').apk" >> "$GITHUB_OUTPUT"

      - run: mv build/app/outputs/flutter-apk/app-release.apk "${{ steps.name.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
